<dialog id="connector-connect-dialog" class="cc-dialog" aria-labelledby="connector-title" aria-describedby="connector-description">
  <header class="cc-header"><span id="connector-icon" class="material-symbols-outlined ig-provider" aria-hidden="true">hub</span><div><p id="connector-brand" class="cc-eyebrow"></p><h2 id="connector-title">Kết nối tài khoản</h2></div><button type="button" id="connector-close" class="cc-close" aria-label="Đóng">×</button></header>
  <p id="connector-context" class="cc-context"></p>
  <ol class="cc-steps" aria-label="Tiến trình kết nối"><li data-connector-step="1"><b>1</b>Kết nối</li><li data-connector-step="2"><b>2</b>Chọn tài khoản</li><li data-connector-step="3"><b>3</b>Hoàn tất</li></ol>
  <div class="cc-body" aria-busy="false">
    <p id="connector-feedback" class="cc-feedback" role="alert" hidden></p>
    <div id="connector-content"></div>
    <p id="connector-description" class="cc-description"></p>
  </div>
  <footer class="cc-footer"><button type="button" id="connector-later" class="ov-button ov-secondary">Để sau</button><button type="button" id="connector-primary" class="ov-button">Tiếp tục</button><a id="connector-report" class="ov-button" hidden>Xem báo cáo<span aria-hidden="true"> →</span></a></footer>
</dialog>
