<section class="lb-context" aria-label="Phạm vi dữ liệu">
  <label><span>Khách hàng / thương hiệu</span><select id="library-client" disabled>{% for client in details.clients %}<option value="{{ client.id }}" {% if details.selected_client and client.id == details.selected_client.id %}selected{% endif %}>{{ client.name }}</option>{% else %}<option value="">Chưa có khách hàng</option>{% endfor %}</select></label>
  <label><span>Khoảng thời gian</span><select id="library-period"><option value="last7">7 ngày gần nhất</option><option value="last30">30 ngày gần nhất</option><option value="last90">90 ngày gần nhất</option><option value="this_month">Tháng này</option><option value="previous_month">Tháng trước</option><option value="custom">Tùy chỉnh khoảng ngày</option></select></label>
  <div class="lb-context-meta"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><div><strong id="library-period-label"></strong><span id="library-timezone">{{ library.timezone }} · {{ library.currency }}</span></div></div>
  <a href="/workspace#client-card" class="lb-text-link">Quản lý khách hàng <span aria-hidden="true">↗</span></a>
  <form id="library-custom-period" class="lb-custom-period" hidden><label>Từ ngày<input id="library-start" type="date" required></label><label>Đến ngày<input id="library-end" type="date" required></label><button class="lb-button lb-secondary">Áp dụng</button><span>Tối đa 366 ngày, theo múi giờ Workspace.</span></form>
</section>
<p id="library-notice" class="lb-notice" role="status" aria-live="polite" hidden></p>
<aside id="library-no-client" class="lb-callout" {% if details.selected_client %}hidden{% endif %}><span class="material-symbols-outlined" aria-hidden="true">business_center</span><div><strong>Chọn khách hàng để bắt đầu</strong><p>Mỗi khách hàng có nguồn dữ liệu và báo cáo riêng. Tạo hoặc chọn khách hàng tại trang Tổng quan.</p></div><a href="/workspace#client-card" class="lb-button lb-secondary">Chọn khách hàng</a></aside>
