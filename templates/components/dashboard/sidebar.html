<aside
    class="fixed left-0 top-0 h-full w-[260px] z-50 flex flex-col dashboard-sidebar"
    id="dashboard-sidebar">
    <!-- Brand -->
    <div class="sidebar-brand shrink-0">
        <a class="flex items-center gap-3 group" href="{{ snapshot_home if dashboard is defined else '/overview' }}" data-path="tong-quan-toan-bo-du-an">
            <div class="sidebar-logo-wrap">
                <img alt="KDH" class="h-9 w-9 shrink-0 object-contain" height="36" src="/static/img/kdh-logo.png" width="36" />
            </div>
            <div class="min-w-0">
                <div class="text-sm font-bold text-white leading-tight tracking-tight group-hover:text-blue-100 transition-colors">KDH Report</div>
                <div class="text-xs text-blue-200/70 leading-tight truncate">
                    {{ bundle.client_name if dashboard is defined else 'KinderHealth Clinic' }}
                </div>
            </div>
        </a>
    </div>
    <!-- Nav label -->
    <div class="px-5 pt-5 pb-1">
        <span class="sidebar-section-label">Báo cáo kênh</span>
    </div>
    <!-- Navigation -->
    <div class="sidebar-scroll flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-3 pb-4">
        {% include "components/dashboard/navigation.html" %}
    </div>
    <!-- Footer -->
    <div class="sidebar-footer shrink-0">
        <div class="flex items-center gap-2 text-xs text-blue-300/60">
            <span class="material-symbols-outlined text-[14px]">verified</span>
            <span>KDH Analytics © 2026</span>
        </div>
        {% if dashboard is defined and viewer_mode %}
        <div class="snapshot-session mt-2">
            <a href="/reports" class="text-xs text-blue-200 hover:text-white hover:underline transition-colors">← Về Admin</a>
            <form method="post" action="/logout" class="inline ml-3">
                <input type="hidden" name="csrf" value="{{ csrf }}">
                <button type="submit" class="text-xs text-blue-300/50 hover:text-red-300 transition-colors">Kết thúc phiên</button>
            </form>
        </div>
        {% endif %}
    </div>
</aside>
