<header
    class="fixed top-0 left-[280px] right-0 h-16 bg-white/95 backdrop-blur-md border-b border-slate-200 z-40 flex items-center px-6 gap-4 shadow-[0_1px_4px_rgba(0,0,0,0.06)] dashboard-header">
    <!-- Mobile toggle -->
    <button aria-controls="dashboard-sidebar" aria-expanded="false" aria-label="Mở menu"
        class="sidebar-toggle shrink-0" id="sidebar-toggle" type="button">
        <span aria-hidden="true" class="material-symbols-outlined">menu</span>
    </button>

    <!-- Logo mobile -->
    <img alt="KDH" class="h-8 w-8 shrink-0 object-contain lg:hidden" height="32"
        src="/static/img/kdh-logo.png" width="32" />

    <!-- Period filters -->
    <div class="flex items-center gap-3 flex-1 min-w-0 overflow-x-auto header-filters">
        <div aria-label="Khoảng thời gian" class="flex items-center bg-slate-100 p-0.5 rounded-lg flex-shrink-0" id="period-switcher">
            <button aria-pressed="false" class="px-3 py-1 rounded-md text-sm text-slate-500 hover:text-slate-800 transition-colors" data-period="7" type="button">7 ngày</button>
            <button aria-pressed="true" class="px-3 py-1 rounded-md bg-white text-sm text-blue-700 font-semibold shadow-sm" data-period="30" type="button">30 ngày</button>
            <button aria-pressed="false" class="px-3 py-1 rounded-md text-sm text-slate-500 hover:text-slate-800 transition-colors" data-period="90" type="button">3 tháng</button>
            <button aria-pressed="false" class="px-3 py-1 rounded-md text-sm text-slate-500 hover:text-slate-800 transition-colors" data-period="180" type="button">6 tháng</button>
        </div>
        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-700 hover:border-blue-300 transition-colors shrink-0" id="date-range" type="button">
            <span aria-hidden="true" class="material-symbols-outlined text-[15px] text-blue-600">calendar_today</span>
            <span class="font-medium" id="date-range-label">{{ bundle.period.start ~ ' – ' ~ bundle.period.end if dashboard is defined else '01/09/2026 – 30/09/2026' }}</span>
        </button>
        <!-- Comparison -->
        <button aria-pressed="true"
            class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-500 hover:border-blue-300 transition-colors shrink-0"
            id="comparison" type="button">
            <span class="text-slate-400 text-xs">So sánh:</span>
            <span class="font-medium text-slate-700" id="comparison-label">{% if dashboard is defined %}{{ bundle.comparison.start ~ ' – ' ~ bundle.comparison.end if bundle.comparison else 'Chưa có' }}{% else %}Kỳ trước{% endif %}</span>
            <span aria-hidden="true" class="material-symbols-outlined text-[15px] text-slate-400">expand_more</span>
        </button>
    </div>

    <!-- Right actions -->
    <div class="flex items-center gap-3 shrink-0">
        <!-- Data status pill -->
        <div class="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100 text-xs text-slate-500">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span>{{ 'Preview' if dashboard is defined and dashboard.preview else 'Rev.' ~ bundle.revision if dashboard is defined else 'Dữ liệu mẫu' }}</span>
        </div>
        <!-- Data source button -->
        <button aria-label="Nguồn dữ liệu"
            class="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-200 text-sm text-slate-600 hover:bg-slate-200 transition-colors"
            id="data-source" type="button">
            <span aria-hidden="true" class="material-symbols-outlined text-[15px] text-blue-600">sync_alt</span>
            <span class="hidden xl:inline">{{ 'Cập nhật: ' ~ (bundle.generated_at or '–') if dashboard is defined else '02/10/2026 15:30' }}</span>
        </button>
        <!-- Export -->
        <button aria-controls="export-menu" aria-expanded="false" aria-haspopup="true"
            class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition-colors shadow-sm"
            id="export-report" type="button">
            <span aria-hidden="true" class="material-symbols-outlined text-[15px]">download</span>
            <span class="hidden sm:inline">Xuất PDF</span>
        </button>
        <!-- Avatar -->
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center shrink-0">
            <span aria-hidden="true" class="material-symbols-outlined text-white text-[16px]">person</span>
        </div>
    </div>
</header>
