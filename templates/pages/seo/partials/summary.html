<div class="flex flex-col md:flex-row md:items-end justify-between gap-space-md mb-space-lg seo-page-header" id="seo-summary">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="px-2.5 py-0.5 rounded-full bg-primary-fixed/50 text-primary font-label-sm text-label-sm tracking-wide">

    </span>
<span class="text-outline text-body-sm">

    </span>
</div>
