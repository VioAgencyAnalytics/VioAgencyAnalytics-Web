<dialog id="seo-filter-dialog" class="dashboard-dialog" aria-labelledby="seo-filter-title">
  <form id="seo-filter-form">
    <h2 id="seo-filter-title">Bộ lọc nâng cao</h2>
    <p>Lọc bảng từ khóa theo nội dung và thứ hạng. Mẫu hiện có 6 từ khóa chi tiết trong tổng số 148 từ khóa của thiết kế.</p>
    <label>Từ khóa hoặc đường dẫn<input id="seo-search" type="search" placeholder="Ví dụ: tiêm chủng" maxlength="200"></label>
    <label>Thứ hạng lũy kế<select id="seo-rank-select"><option value="all">Tất cả từ khóa</option>{% for k in [5,10,20,30,50,100] %}<option value="top{{ k }}">Top {{ k }} (1–{{ k }})</option>{% endfor %}<option value="new">Mới vào Top 10</option><option value="risers">Tăng từ 5 hạng trở lên</option></select></label>
    <div class="dialog-actions"><button type="button" id="seo-reset-filters">Đặt lại</button><button type="button" data-close-dialog>Hủy</button><button type="submit" class="confirm-button">Áp dụng</button></div>
  </form>
</dialog>
<dialog id="seo-detail-dialog" class="dashboard-dialog seo-detail-dialog" aria-labelledby="seo-detail-title">
  <h2 id="seo-detail-title">Chi tiết SEO</h2>
  <div id="seo-detail-content"></div>
  <div class="dialog-actions"><button type="button" data-close-dialog class="confirm-button">Đóng</button></div>
</dialog>
<dialog id="seo-weekly-dialog" class="dashboard-dialog" aria-labelledby="seo-weekly-title">
  <h2 id="seo-weekly-title">Báo cáo SEO tuần</h2>
  <p id="seo-weekly-period"></p>
  <dl id="seo-weekly-metrics" class="seo-detail-metrics"></dl>
  <p>Báo cáo đang hiển thị kỳ 7 ngày với dữ liệu mẫu. Bạn có thể lưu toàn bộ báo cáo thành PDF hoặc xuất CSV.</p>
  <div class="dialog-actions"><button type="button" data-close-dialog>Đóng</button><button type="button" id="seo-weekly-print" class="confirm-button">In / Lưu PDF</button></div>
</dialog>
