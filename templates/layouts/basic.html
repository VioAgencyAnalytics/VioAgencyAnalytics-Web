<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Báo cáo' }} | VioAgencyAnalytics</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/shared/basic.css') }}" />
    <link rel="stylesheet" href="/static/css/shared/fonts.css" />
    <link rel="stylesheet" href="/static/css/dist/dashboard.css" />
    <script src="/static/js/shared/sidebar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface">
    {% include "components/dashboard/sidebar.html" %}
    <button type="button" id="sidebar-backdrop" aria-label="Đóng menu" hidden></button>
    <div class="dashboard-shell">
      <main class="content" id="main-content">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-controls="dashboard-sidebar" aria-expanded="false" aria-label="Mở menu báo cáo"><span class="material-symbols-outlined" aria-hidden="true">menu</span></button>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="{{ url_for('static', path='js/shared/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
